<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Crystallyzer 2 illustration</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse 60% 55% at 52% 58%, #26303f 0%, #141a23 55%, #0c1016 100%);
  }
  .stage { position: absolute; inset: 0; perspective: 2600px; perspective-origin: 50% 30%; }
  .world { position: absolute; left: 50%; top: 52%; transform-style: preserve-3d; transform: rotateX(57deg) rotateZ(-28deg) translate(-357px, -204px); }
  .world div { position: absolute; left: 0; top: 0; transform-origin: 0 0; transform-style: preserve-3d; }
  .shadow { width: 820px; height: 520px; background: radial-gradient(closest-side, rgba(0,0,0,.65), transparent); filter: blur(24px); transform: translate3d(-60px, -40px, -1px) !important; }
</style>
<body>
<div class="stage"><div class="world" id="world"><div class="shadow"></div></div></div>
<script>
// Millimetres from crystallyzer/device.py, drawn at 1.7 px per mm.
const K = 1.7;
const world = document.getElementById('world');
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
function face(o, u, v, w, h, style = {}, html = '') {
  const n = cross(u, v);
  const d = document.createElement('div');
  d.style.width = `${w * K}px`;
  d.style.height = `${h * K}px`;
  const O = o.map((x) => x * K);
  d.style.transform = `matrix3d(${u[0]},${u[1]},${u[2]},0,${v[0]},${v[1]},${v[2]},0,${n[0]},${n[1]},${n[2]},0,${O[0]},${O[1]},${O[2]},1)`;
  Object.assign(d.style, style);
  d.innerHTML = html;
  world.append(d);
  return d;
}
function box(x, y, z, w, d, h, colours, extra = {}) {
  const [top, front, side, back] = colours;
  face([x, y, z + h], [1, 0, 0], [0, 1, 0], w, d, { background: top, ...(extra.top || {}) }, extra.topHtml || '');
  face([x, y + d, z + h], [1, 0, 0], [0, 0, -1], w, h, { background: front, ...(extra.front || {}) }, extra.frontHtml || '');
  face([x, y, z + h], [0, 1, 0], [0, 0, -1], d, h, { background: side });
  face([x + w, y + d, z + h], [0, -1, 0], [0, 0, -1], d, h, { background: back || side });
  face([x + w, y, z + h], [-1, 0, 0], [0, 0, -1], w, h, { background: back || side });
}

const W = 420, D = 240, H = 96;
// The body: dark anodised aluminium with a birch top edge.
box(0, 0, 0, W, D, H, [
  'linear-gradient(135deg, #2b3340, #1f2631)',
  'linear-gradient(#d6c09b 0 7px, #b89f78 7px 8px, #1c222c 8px, #151a22)',
  'linear-gradient(#cdb690 0 7px, #a88f69 7px 8px, #141922 8px, #10141b)',
], { frontHtml: '<div style="position:absolute;right:46px;top:40px;width:9px;height:9px;border-radius:50%;background:#7fd3ff;box-shadow:0 0 12px #7fd3ff"></div>' });

// Smoked window over the diffraction tunnel, with the beam and the glowing screen inside.
face([15, 15, H + 0.4], [1, 0, 0], [0, 1, 0], 387, 70, {
  background: 'linear-gradient(90deg, rgba(8,10,14,.92), rgba(14,18,24,.9))',
  borderRadius: '6px', boxShadow: 'inset 0 0 0 2px rgba(255,255,255,.05)',
}, `<div style="position:absolute;left:${18*K}px;top:${35*K - 1.5}px;width:${342*K}px;height:3px;background:linear-gradient(90deg,#ff5a46,#ff3d2e);box-shadow:0 0 10px #ff3d2e,0 0 24px rgba(255,61,46,.6)"></div>
<div style="position:absolute;left:${358*K}px;top:${5*K}px;width:${6*K}px;height:${60*K}px;background:#ffd7cf;border-radius:3px;box-shadow:0 0 26px 8px rgba(255,61,46,.75),0 0 60px 20px rgba(255,61,46,.35)"></div>
<div style="position:absolute;left:${8*K}px;top:${26*K}px;width:${20*K}px;height:${18*K}px;border-radius:4px;background:#2d3644;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)"></div>`);

// A slide standing in its slot.
face([70, 20, H + 34], [0, 1, 0], [0, 0, -1], 50, 34, {
  background: 'radial-gradient(circle, #10141b 0 30%, transparent 31%), #e8c15f', borderRadius: '3px',
  boxShadow: 'inset 0 0 0 3px #caa147',
}, '<div style="position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle,#fff 0 1.2px,transparent 1.6px) 0 0/6px 6px;opacity:.65"></div>');

// The touchscreen on its tilted panel, showing the real app.
const tilt = 15 * Math.PI / 180, dd = 120;
const rise = dd * Math.sin(tilt);
face([15, 110, H + rise + 2], [1, 0, 0], [0, Math.cos(tilt), -Math.sin(tilt)], 200, dd, {
  background: '#06080b', borderRadius: '10px', boxShadow: '0 0 0 1px rgba(255,255,255,.08)',
}, `<img src="../images/app-diffraction.png" style="position:absolute;left:${6*K}px;top:${7*K}px;width:${188*K}px;height:${106*K}px;object-fit:cover;border-radius:3px">`);
face([15, 110, H + rise + 2], [1, 0, 0], [0, 0, -1], 200, rise + 2, { background: 'linear-gradient(#1b212b, #12161d)' });
face([15, 110, H + rise + 2], [0, Math.cos(tilt), -Math.sin(tilt)], [0, 0, -1], dd, 3, { background: '#0f1318' });

// The sample stage: turntable, a glowing crystal, and the camera tower above.
const sx = 290, sy = 165, sr = 32;
face([sx - sr - 6, sy - sr - 6, H + 0.6], [1, 0, 0], [0, 1, 0], 2 * sr + 12, 2 * sr + 12, { borderRadius: '50%', background: 'radial-gradient(circle, #0b0e13 0 70%, #2c3542 71% 74%, #11151c 75%)' });
face([sx - sr, sy - sr, H + 3], [1, 0, 0], [0, 1, 0], 2 * sr, 2 * sr, { borderRadius: '50%', background: 'radial-gradient(circle, #0a0c10 0 62%, #384252 63% 66%, #1b222c 67%)', boxShadow: '0 0 0 1px rgba(255,255,255,.1)' });
face([sx - 11, sy - 11, H + 4], [1, 0, 0], [0, 1, 0], 22, 22, {
  clipPath: 'polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%)',
  background: 'conic-gradient(from 30deg, #ffe28a, #ff9a6a, #e86cc9, #8a7cff, #ffe28a)', filter: 'drop-shadow(0 0 10px rgba(255,200,120,.9))',
});
const tx = sx + 40, ty = sy + 22;
box(tx - 6, ty - 6, H, 12, 12, 150, ['#c9ced6', 'linear-gradient(90deg,#aeb5c0,#8a929e)', '#727a86']);
box(sx - 14, ty - 6, H + 142, tx - sx + 20, 12, 8, ['#d3d8df', '#9aa2ae', '#7c8490']);
box(sx - 14, sy - 14, H + 128, 28, 28, 14, ['#3a4452', 'linear-gradient(#3a4452,#252c37)', '#202631']);
face([sx - 7, sy - 7, H + 128 - 0.2], [1, 0, 0], [0, 1, 0], 14, 14, { borderRadius: '50%', background: 'radial-gradient(circle, #6b8bb0 0 20%, #0b0e12 45%, #2a313c 70%)' });
face([sx - 16, sy - 16, H + 118], [1, 0, 0], [0, 1, 0], 32, 32, { borderRadius: '50%', background: 'rgba(255,214,120,.18)', boxShadow: 'inset 0 0 0 2px rgba(255,214,120,.6)' });
box(tx + 8, sy - 16, H, 28, 32, 10, ['#1f2630', '#161b23', '#12161d']);
document.title = 'ready';
</script>
</body>
</html>
