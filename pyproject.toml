[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "crystallyzer"
version = "2.0.0a1"
description = "A Raspberry Pi optical bench for crystals: laser diffraction, polarized light and growth."
readme = "README.md"
license = "MIT"
authors = [{ name = "Bohdan Hlushko" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
pi = ["gpiozero>=2", "smbus2>=0.4", "RPi.bme280>=0.2.4"]
test = ["pytest>=8"]

[project.scripts]
crystallyzer = "crystallyzer.__main__:main"

[tool.setuptools.packages.find]
include = ["crystallyzer*"]

[tool.setuptools.package-data]
crystallyzer = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
